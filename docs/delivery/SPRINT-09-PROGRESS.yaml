notes:
  - "User confirmed real AWS Bedrock credentials are available (AWS CLI profile 'default', region us-east-1, models incl. anthropic.claude-sonnet-4-5-20250929-v1:0 confirmed reachable via `aws bedrock list-foundation-models`). No Azure AI Foundry credentials available this sprint — Azure adapter is implemented and unit-tested but its live validation is explicitly deferred."
  - "Credential handling: read-only bind mount of the host's ~/.aws into the backend container plus AWS_PROFILE/AWS_REGION passed via the gitignored root .env — no static secret value is ever written into a tracked file or into this session's persisted state."
  - "Design decision: object_understanding registers as a 4th stage of the existing source_processing PipelineRun/StageRun/WorkItem engine (depends_on detect_dependencies), per BL-003 — no parallel execution mechanism, no new PipelineRunKind. ATC/evidence correlation are read at process_item time and may be empty (independent PipelineRuns); an object with no supplemental evidence still gets object understanding, just with a narrower evidence package."
  - "ADR-012 compliance: an AI provider failure or a schema-valid-but-domain-invalid response (unresolvable evidence_refs, INSUFFICIENT_CONTEXT asserting a purpose, COMPLETED with no evidence_refs/purpose text) is never persisted as a trustworthy result — it is persisted as ObjectUnderstandingStatus.FAILED with the error recorded, and the WorkItem still completes normally (a per-object AI outcome, not a pipeline processing error)."
  - "All sprint capabilities implemented and validated, including a real live Bedrock run and a real live Playwright e2e of the demonstrable outcome. ready_for_review set to true; docs/delivery/SESSION_HANDOFF.md updated accordingly."
