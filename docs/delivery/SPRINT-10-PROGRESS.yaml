notes:
  - "Capability plan derived from docs/delivery/sprints/SPRINT-10-business-rule-discovery.md, ADR-008, ADR-012, ADR-011, and the SPRINT-09 object_understanding stage pattern (backend/src/pipeline/stages.py, backend/src/ai/object_understanding/)."
  - "Next Alembic revision is 0012 (down_revision 0011_object_understanding)."
  - "No condition/action rule structure or user-validation flag pre-exists in the codebase; both are new in this sprint."
  - "Design decision: ref_id is only unique within one object's own evidence package, not across objects — the finalize consolidation step and its test caught this; fixed by keying evidence-ref dedup on (ref_id, source_type, entity_id) rather than ref_id alone (pipeline/stages.py::_evidence_ref_key)."
  - "Design decision: unlike ObjectUnderstanding's single upserted row, a provider/domain-validation failure for business_rule_discovery has no natural single 'FAILED' row to write (the result is a list of candidate rules per object). Recorded durably on WorkItem.last_error instead (the same field the engine itself would set on an uncaught exception), while leaving that object's already-persisted non-validated candidates untouched — never failing the whole stage for one object's AI hiccup, and never fabricating a rule."
  - "All sprint capabilities (CAP-001..CAP-007) done. /clean-core-review-sprint returned READY_TO_FINISH: YES; closed by /clean-core-finish-sprint. See docs/delivery/results/SPRINT-10-RESULT.md."
