  - id: CAP-012
    description: >-
      Panaya ETL adapter rewritten against a real ~2.8GB customer export (user-provided
      raw .xml, not zipped). The original ADR-017 profile (`<PanayaExport>`) was invented —
      no sample ever existed before this. Real structure verified: one <ROOT_ELEMENT> with
      ~90 sibling sections, several in the single-digit millions of rows; not strictly
      well-formed XML (real, load-bearing illegal control bytes and char-refs in extracted
      source text).
    status: done
    validation: >-
      12 tests (test_evidence_panaya.py rewritten + SanitizingXMLStream boundary test) +
      full end-to-end runs against the real 2.8GB file: inspect() 98s (all 90 sections
      counted), full pipeline import via direct script 226.5s and via the real HTTP upload
      endpoint ~340s total (42.75s upload+hash + background processing) -> IMPORTED_PARTIAL,
      84189 records (4 of 5 curated sections hit the 20k/section cap, explicit truncation
      warnings), correct MATCHED_EXACT correlation confirmed via synthetic test. 109/109
      backend pytest.
    notes: >-
      Found and fixed 3 more real bugs during this validation, all real-scale issues no
      synthetic fixture would have caught: (1) SanitizingXMLStream.read() could return b""
      before true EOF (violates the file-like read() contract — expat would have treated it
      as premature end-of-stream); (2) the char-ref regex ran on the emitted slice instead of
      the full carry+raw buffer, so a reference could be split exactly at the read-boundary
      and leak through unstripped — caught by a test using a deliberately tiny read size;
      (3) evidence.correlation.correlate_dataset_records deleted prior correlations via an
      `IN (...)` list of Python ids — crashed on the real ~180k-record import
      (psycopg.OperationalError: number of parameters must be between 0 and 65535); fixed
      with a subquery. Also closed a second "stuck forever" gap: `_run_stage` has no
      try/except around `finalize`, so the correlation crash left dataset.status uncommitted
      — `_evidence_import_finalize` now catches a correlation failure the same way `prepare`
      already did. BL-006 resolved (superseded); BL-009/BL-010 opened for the remaining,
      lower-priority scale considerations (curated-section coverage, correlation batching).
  - id: CAP-013
    description: >-
      Signavio adapter rewritten against a real ~28MB customer export (user reported
      "importou com sucesso, mas 0 registros"). Same root cause class as Panaya's CAP-012:
      the original ADR-017 profile (`<SignavioSystem>`-rooted metadata,
      `keyFigureId`/`header`/`rows` as top-level JSON keys) was invented and did not match
      reality at all — real metadata is ABAP-serialized XML (`<asx:abap>`/`<item><KEY>/<VALUE>`),
      real chunks nest everything under a `"dataSet"` key with the row array called `data`.
    status: done
    validation: >-
      6 tests (test_evidence_signavio.py rewritten + a 10k-row bind-parameter-limit
      regression) + full end-to-end run against the real file: 494 chunks, ~4.4M rows ->
      IMPORTED_FULL, capabilities=['PROCESS_KPI'], run_pipeline 913.6s total, backend
      container memory stayed under ~350MB throughout (was ~20GB before the correlation
      fix below). 112/112 backend pytest.
    notes: >-
      Found and fixed 3 more real, scale-only bugs: (1) GENERAL safety net —
      `_evidence_import_finalize` used to mark IMPORTED_FULL whenever `inspect()`-predicted
      capabilities were non-empty, regardless of whether any batch actually produced a
      record — exactly how the Signavio mismatch above went unnoticed as "successful"; now
      forces IMPORTED_PARTIAL + an explicit warning whenever capabilities are detected but
      zero records were extracted, for any adapter, not just Signavio. (2) A single bulk
      `INSERT ... ON CONFLICT DO NOTHING` for a whole chunk crashed once a real chunk's row
      count (~9600) x columns exceeded PostgreSQL's 65535-bind-parameter limit — the same
      failure class CAP-012 fixed for correlation; fixed generically with
      evidence/adapters/base.py::bulk_insert_evidence_records (chunked, RETURNING-counted
      since cursor.rowcount is unreliable for multi-row inserts). (3) CRITICAL — the fix for
      (2) initially still loaded every EvidenceRecord as an ORM object before/after insert
      via correlate_dataset_records, live-tested at 4.4M records and confirmed pushing the
      backend container to ~20GB RSS / 100% CPU (killed before OOM); fixed with id-ordered
      pagination (5000/page) — and while fixing it, avoided a second real footgun: an
      earlier draft used `session.expunge_all()` per page, which would have silently
      detached the caller's own `dataset` object mid-`_evidence_import_finalize`, losing its
      pending status/warning updates; fixed to expunge only that page's own records.
      BL-010 resolved (confirmed, not just theoretical); BL-011 opened for the other three
      adapters' still-unoptimized per-row pattern (not yet proven necessary at their scale).
  - id: CAP-014
    description: >-
      FUE User Validation adapter removed (user decision, validated against a real sample:
      the `.bin` payloads are a proprietary ~7.9-bits/byte-entropy compressed/encrypted format
      with no available decoder, no safe partial-import path per ADR-017's own anti-guessing
      rule). Added dataset deletion (DELETE /evidence-datasets/{id}, cascades to
      artifacts/records/correlations + removes on-disk storage). SourceIngestion.tsx UI:
      file inventory and scan history are now collapsible sections (default collapsed), scan
      history moved to render right after the active-scan-status block and unconditionally
      (previously gated on scans.length > 1, which hid it for a single scan).
    status: done
    validation: >-
      110/110 backend pytest (removed 3 FUE tests, added test_delete_dataset_removes_record_and_storage_file
      to test_evidence_api.py); frontend typecheck clean. Removed backend/src/evidence/adapters/fue.py,
      backend/tests/test_evidence_fue.py; EvidenceDatasetType.FUE_USER_VALIDATION removed (plain
      String(50) column, no migration needed); removed the one real lingering FUE dataset (id=200)
      from the dev database and its on-disk storage directory.
    notes: >-
      Answered user's duplicate-import question (no automatic dedup exists — BL-012 opened;
      the new delete endpoint is the manual mitigation for accidental duplicates today).
  - id: CAP-015
    description: >-
      Re-processing source (Step 1 rescan + Step 3 reparse) now automatically re-correlates
      every existing supplemental evidence dataset of the assessment against the reconciled
      SAPObject set (user-requested, fix-now decision — this is a gap in the delivered
      correlation model, not a new feature). `EvidenceCorrelation.target_id` is a polymorphic
      column with no DB-level FK, so a SAPObject removed/renamed by the stable-identity
      reconciliation (CAP-001) would otherwise leave a dangling or stale correlation with no
      automatic fix and no way for the user to notice.
    status: done
    validation: >-
      112/112 backend pytest (2 new in test_evidence_pipeline.py:
      test_reprocessing_source_recorrelates_existing_evidence_datasets confirms a removed
      object's correlation flips MATCHED_EXACT -> UNMATCHED and a newly-added object's
      previously-UNMATCHED record becomes MATCHED_EXACT, both automatically on reparse with no
      manual re-import; test_parse_finalize_recorrelation_failure_does_not_lose_reconciliation
      is the safety-net regression, mirroring the existing evidence_import finalize pattern).
    notes: >-
      `pipeline/stages.py::_parse_finalize` now loops every EvidenceDataset of the assessment
      and calls `correlate_dataset_records` per dataset after the stale-object reconciliation,
      catching per-dataset failures (marks that dataset FAILED with an error, mirrors
      `_evidence_import_finalize`'s established safety net) and always committing at the end —
      `_run_stage` has no try/except around its call to `finalize`, so an uncaught exception
      would silently lose even the object reconciliation that already ran. ADR-017's
      Correlation section amended to document why this is required (no DB-level FK on
      `target_id`) rather than optional.
