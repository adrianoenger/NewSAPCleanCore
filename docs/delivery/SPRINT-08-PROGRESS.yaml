  - id: CAP-010
    description: Full validation pass (pytest, typecheck/build) and documentation/handoff update.
    status: done
    validation: "97/97 backend pytest; frontend typecheck+build clean; live Playwright E2E (CAP-009); BACKLOG.md updated (BL-004 resolved, BL-005/BL-006 opened); SESSION_HANDOFF.md and EXECUTION_STATE.yaml updated."
    notes: >-
      Background security review flagged a HIGH path-traversal/arbitrary-file-write in
      api/routes/evidence.py (unsanitized upload filename used directly in path construction).
      Fixed: added _safe_basename() (strips directory components via PurePosixPath, rejects
      literal backslashes/degenerate names) and _resolve_under() (defense-in-depth containment
      check) to both the inspect and create handlers; added test_safe_basename_strips_traversal_and_rejects_degenerate_names
      and test_path_traversal_filename_never_escapes_storage_root to test_evidence_api.py.

      User-reported bug (manual UI test): "Unrecognized evidence package format" for every
      upload. Root cause: adapter.detect() only checked whether the *filename* literally
      contained "panaya"/"signavio"/"fue" — a real export's filename essentially never does.
      Fixed: detect(filename, file_path) now sniffs actual ZIP/XML/JSON structure (primary XML
      root tag PanayaExport / SignavioSystem+chunked JSON / .txt+.bin pair for FUE) as the
      deciding signal, filename hint stays only as a fast-path. Verified live via curl: a ZIP
      named "generic_export.zip" (no provider name) with Panaya-shaped content now detects and
      imports to IMPORTED_FULL. 97/97 pytest still green.
