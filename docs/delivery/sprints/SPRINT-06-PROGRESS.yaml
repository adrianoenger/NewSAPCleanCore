notes:
  - "Sprint started 2026-09-24, closed out 2026-09-25. Branch sprint/06-durable-pipeline-execution from main."
  - "Design: pipeline wraps existing scanner.py/dispatcher.py/dependency_detector.py handlers as work-item-driven stages (scan -> parse -> detect_dependencies); ATC import stays a standalone upload-triggered action per ADR-016 (unchanged contract). See BL-002."
  - "Alembic 0007 (pipeline_run, stage_run, work_item) applied on the running dev DB. 68/68 pytest (63 pre-existing + 12 SPRINT-06 tests in test_sprint06.py; test_foundation.py health-contract literal bumped to 0007 per existing per-sprint convention)."
  - "Live end-to-end smoke test (curl) against a synthetic 3000-file dataset: start -> pause mid-scan (cooperative) -> resume -> SIGKILL backend mid-scan (crash simulation) -> restart -> orphan recovery surfaced run as paused/resumable with progress intact -> resume -> full completion of scan+parse+detect_dependencies with real SAPObject/SAPObjectDependency rows persisted."
  - "clean-core-review-sprint (first pass) returned READY_TO_FINISH: NO — CAP-006 had not been run in a real browser, and the retry endpoint's success path had no reliable evidence. Both were addressed: (1) manually drove the PipelineRunner UI end to end via Playwright, which surfaced two real bugs — runsQuery.refetchInterval never polled a freshly-created 'pending' run, and the activeRunId-selection useEffect raced a stale query cache and silently reverted the active run back to a previous one after clicking 'Iniciar Pipeline' — both fixed in PipelineRunner.tsx; (2) the same UI pass also caught a cross-run correctness bug in stages.py: _dependencies_prepare scoped objects by assessment_id instead of the current run's own scan, so a second pipeline run's detect_dependencies stage would try to reprocess every object ever parsed for the assessment, including ones from an earlier (possibly now-deleted) scan — fixed to scope via SourceFile.scan_id == run.source_scan_id, matching _parse_prepare's existing scoping, with a regression test (test_second_pipeline_run_dependencies_stage_ignores_other_scans). (3) Added test_retry_endpoint_success_path_then_resume_completes, which calls the real POST .../work-items/{id}/retry and POST .../resume HTTP routes (not just the engine) end to end."
  - "npm run typecheck and npm run build (frontend) both clean. All UI smoke-test client/assessment DB rows and synthetic host directories removed afterward."
