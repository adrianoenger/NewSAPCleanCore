notes:
  - "Scope boundary: Dashboard Geral / Executive View remain placeholders — SPRINT-15 (navigation-perspectives) is the dedicated sprint for those. This sprint's 'dashboards and drill-down' capability is delivered as a Clean Core section inside the already-implemented ApplicationBrowser (Architecture View), consistent with how SPRINT-12 added SapGuidancePanel to the same screen."
  - "Clean Core conclusions are computed per Application (not per SAPObject) — matches the sprint's demonstrable outcome ('Open an application, see risk/importance/recommendation') and the Baseline's Architecture/Executive View framing of applications as the recommendation unit."
  - "No manual user-override/validation endpoint for the Clean Core recommendation is planned — not in this sprint's planned capabilities; recorded as backlog if judged valuable."
  - "Mid-sprint schema fix (CAP-003): a live Bedrock run over demo-source/ABAP initially showed all 4 discovered applications persisting as CleanCoreStatus.FAILED — the model routinely determines technical_risk/business_importance for a sparsely-evidenced object while still choosing status=INSUFFICIENT_CONTEXT for the overall recommendation confidence, which the original validator (one status field gating both dimensions' nullability) always rejected. Fixed by making technical_risk/business_importance independently nullable, each validated against its own rationale/evidence_refs, with status derived from whether anything was determined at all — matches Baseline core rule 8's own 'these are separate dimensions' principle more faithfully than the original all-or-nothing design. Re-validated live after the fix: 2 RETAIN, 1 REPLATFORM, 1 REVIEW (undetermined-dimensions case), no FAILED. See ai/clean_core_analysis/schema.py's module docstring."
  - "BL-008 (pipeline.engine.recover_orphans is global/unscoped) reproduced live twice during this sprint's own validation: running the backend pytest full suite concurrently with a live Playwright demo caused (a) the live demo's own in-flight run to be paused mid-execution, and (b) test_sprint06.py::test_recover_orphans_requeues_running_work to see 2 orphans instead of the 1 it manufactured. Both were transient — resuming the paused run completed it correctly, and a subsequent full-suite run with no concurrent activity passed 208/208. No code change made (BL-008 is pre-existing, unrelated to this sprint's capabilities); recorded here only as a reproduction data point, and as a reminder not to run pytest and a live pipeline demo concurrently against the same shared dev database."
