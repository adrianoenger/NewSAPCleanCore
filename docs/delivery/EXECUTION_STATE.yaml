  - "SPRINT-08 completed (2026-09-25). Final scope: 15 capabilities (CAP-001..CAP-015) — stable SAPObject identity (migrations 0008/0009/0010), EvidenceDataset/Artifact/Record/Correlation model, adapter contract + Panaya/Signavio/HANA Sizing/Readiness Check adapters (rewritten against real customer exports post-completion; FUE dropped after a real sample proved its .bin payloads an undecodable proprietary format), generalized durable pipeline engine (PipelineRunKind), full evidence API incl. dataset delete, Step-1 'Fontes Complementares' UI (collapsible file inventory/scan history, inline delete confirmation), and automatic evidence re-correlation on source reprocessing. 112/112 backend pytest, frontend typecheck/build clean, live Playwright E2E against the real Assessment01/Rodobens data plus a disposable throwaway assessment for the delete flow. See docs/delivery/results/SPRINT-08-RESULT.md."
  - "SPRINT-09 completed (2026-09-26). Final scope: 12 capabilities (CAP-001..CAP-012). object_understanding registers as a 4th source_processing pipeline stage (BL-003) after detect_dependencies: builds a provider-agnostic evidence package (source excerpt + correlated ATC + correlated supplemental evidence), calls the configured AIProvider (Bedrock live-validated; Azure AI Foundry unit-tested only, no credentials this sprint) through the versioned object_understanding/v1 prompt+schema, validates schema/evidence-refs/domain rules before persistence (ADR-012 — a provider or domain-validation failure persists as ObjectUnderstandingStatus.FAILED, never a false COMPLETED), and upserts one ObjectUnderstanding row per SAPObject (migration 0011). Exposed via SAPObjectDetailRead.understanding and rendered in ObjectBrowser's detail panel. 138/138 backend pytest, frontend typecheck/build clean, a real live Bedrock run over demo-source/ABAP (all 4 demo objects reached COMPLETED with grounded, cited purposes), and a real live Playwright e2e of the full demonstrable flow (ingest -> process -> AI panel in Technical View). See docs/delivery/results/SPRINT-09-RESULT.md."
  - "SPRINT-10 completed (2026-09-26). Final scope: 7 capabilities (CAP-001..CAP-007). business_rule_discovery registers as a 5th source_processing stage after object_understanding: reuses object_understanding's evidence package (persisted understanding is prompt context only, never a citable evidence ref, per ADR-008), calls the AIProvider through the versioned business_rule_discovery/v1 prompt+schema requiring condition/action/type/confidence/evidence structure, validates before persistence (a COMPLETED result with zero rules is valid — never forced), and persists candidate BusinessRule rows (migration 0012). A finalize step performs basic consolidation (exact rule_type + normalized condition/action match merges duplicates, preferring a user-validated survivor; fixed a ref_id-collision bug across objects found via the consolidation test). New Functional View (BusinessRuleBrowser) lists rules with evidence drill-down to the exact SAPObject/supplemental evidence and a PATCH validation hook. 154/154 backend pytest, frontend typecheck/build clean, live-validated twice (real Bedrock HTTP API + real Playwright against the electron-vite renderer — 3 real grounded rules over demo-source/ABAP). See docs/delivery/results/SPRINT-10-RESULT.md."
  - "SPRINT-11 completed (2026-09-26). Final scope: 7 capabilities (CAP-001..CAP-007). application_discovery registers as a 6th source_processing stage after business_rule_discovery: deterministic clustering (ai/application_discovery/clustering.py — dependency edges resolved via canonical_key, shared_package via correlated ATC/evidence, shared_concept below a 50% genericity threshold) runs before any AI call; persists Application rows (migration 0013) + SAPObject.application_id membership; AI names/describes each cluster via the versioned application_discovery/v1 prompt+schema, only setting AI_NAMED on a genuinely COMPLETED result (INSUFFICIENT_CONTEXT stays CANDIDATE, never a fabricated name). Reprocessing never touches a USER_RENAMED/MERGED application's membership or content. New API (list/detail/rename/move-object/merge) and Architecture View (ApplicationBrowser) with inline manual rename/move/merge actions. 173/173 backend pytest, frontend typecheck/build clean, live-validated twice (real Bedrock HTTP API incl. rename/move/merge/reprocessing-preservation against real persisted rows + real Playwright against the electron-vite renderer). BL-016 recorded (process/usage-correlation clustering signal deferred — no generic cross-object join key without guessing a provider-specific payload shape). See docs/delivery/results/SPRINT-11-RESULT.md."
  - "SPRINT-12 completed (2026-09-26). Final scope: 5 capabilities (CAP-001..CAP-005). SAPKnowledgeProvider abstraction (ai/knowledge_provider.py) + generic MCPKnowledgeProvider adapter (ai/knowledge_providers/mcp_client.py) against the real mcp SDK (mcp>=1.2, resolved to mcp==2.2.0 — its actual API differs substantially from older SDK docs; fixed against the installed package's real signatures). Configurable mcp-sap-docs/mcp-abap endpoints (settings.py, both optional). ai/knowledge_service.py enforces query-only-when-relevant (POST-only trigger, never re-queries a target that already has a reference) plus cross-target cache reuse via query_fingerprint (ADR-007). New SapKnowledgeReference model (migration 0014), deliberately separate from EvidenceDataset/EvidenceRecord (ADR-017) since its provenance is a live MCP retrieval, not an imported dataset. GET/POST /assessments/{id}/sap-knowledge/{applications|business-rules}/{target_id}; frontend SapGuidancePanel wired into ApplicationBrowser and BusinessRuleBrowser. No real mcp-sap-docs/mcp-abap server exists in this environment — the adapter is unit-tested against a mocked transport only (BL-018, mirrors the SPRINT-09 Azure Foundry precedent); ATC finding detail has no per-row view to plug guidance into yet (BL-017). 189/189 backend pytest (verified via pytest's own process exit code after an earlier piped-command false-positive was caught and fixed), frontend typecheck/build clean, live Playwright check of the empty-state->consult->no-crash path against the real electron-vite renderer. See docs/delivery/results/SPRINT-12-RESULT.md."
  - "SPRINT-13 completed (2026-09-26). Final scope: 6 capabilities (CAP-001..CAP-006). clean_core_analysis registers as a 7th source_processing stage after application_discovery: per non-MERGED Application, assembles an evidence package (technical pool: source/dependency/ATC/TechnicalFinding + technical supplemental signals; business pool: object identity + quality-gated process/usage/role supplemental signals tagged PROCESS_USAGE_EVIDENCE; guidance pool: already-retrieved SapKnowledgeReference), calls the versioned clean_core_analysis/v1 prompt+schema, and upserts one CleanCoreAssessment row per Application (migration 0015) — technical_risk/business_importance/recommendation kept as separate fields (Baseline core rule 8), recommendation includes REVIEW as the explicit fallback. Embedded as ApplicationRead.clean_core; Architecture View (ApplicationBrowser) gained a Clean Core panel + recommendation distribution summary. Mid-sprint schema fix: technical_risk/business_importance made independently nullable (each gated by its own rationale/evidence, status derived from what was actually determined) after a live Bedrock run showed the original one-status-gates-both-dimensions design rejecting every real partial result as FAILED — see ai/clean_core_analysis/schema.py's docstring. 208/208 backend pytest, frontend typecheck/build clean, a real live Bedrock run over demo-source/ABAP (2 RETAIN, 1 REPLATFORM, 1 REVIEW, no FAILED) and a real Playwright pass against the electron-vite renderer. BL-008 (pre-existing, global/unscoped recover_orphans) reproduced live twice when a pytest run and the live demo overlapped against the shared dev DB — both transient, no code change. BL-019 recorded (no manual override/validation for the Clean Core recommendation). See docs/delivery/results/SPRINT-13-RESULT.md."
  - "SPRINT-14 completed (2026-09-26). Final scope: 7 capabilities (CAP-001..CAP-007). embeddings registers as an 8th source_processing stage after clean_core_analysis: new EmbeddingProvider abstraction (ai/embedding_provider.py, mirrors AIProvider — Bedrock Titan Text Embeddings V2 live-validated, Azure Foundry unit-tested only per the established ADR-006 precedent); ai/embeddings/source_builder.py builds embeddable text/metadata for SAP_OBJECT (via completed ObjectUnderstanding, never raw source), APPLICATION, BUSINESS_RULE and quality-gated process/usage EVIDENCE_RECORD signals (same pool ai.clean_core_analysis.evidence_package trusts); upserts one Embedding row per (assessment_id, entity_type, entity_id) keyed by content_hash so unchanged content is never re-embedded (migration 0016, pgvector Vector(1024) + HNSW cosine index declared in the ORM model so alembic check sees zero new drift). ai/embeddings/search.py + GET /assessments/{id}/semantic-search (debug endpoint, assessment-scoped, entity_types filter). Frontend: SemanticSearchPanel under a new sidebar 'Debug' nav group (deliberately not a 5th result perspective, Baseline core rule 15). Fixed a .gitignore collision (blanket `embeddings/` pattern, meant for a pre-pgvector file-based vector-index cache, was shadowing the new ai/embeddings/ source directory — re-anchored to /embeddings/). 213/213 backend pytest (fresh rebuilt Docker image with pgvector baked into pyproject.toml), frontend typecheck/build clean, a real live Bedrock run (structured completion + Titan embeddings) over demo-source/ABAP completing the full 8-stage pipeline with 0 failures, and a real Playwright pass against the electron-vite renderer confirming ranked, assessment-scoped, filterable search results. BL-020 recorded (business_rule_discovery's recreate-not-upsert semantics leave orphaned Embedding rows on reprocessing — pre-existing design choice of that stage, not this one's). See docs/delivery/results/SPRINT-14-RESULT.md."
  - "SPRINT-15 completed (2026-09-26). Final scope: 8 capabilities (CAP-001..CAP-008). Dashboard Geral and Executive View are now real pages (previously PlaceholderView) backed by a new GET /assessments/{id}/dashboard-summary aggregation endpoint (objects analyzed, customizations identified = discovered Application count, critical findings = TechnicalFinding severity HIGH, high-impact objects = objects whose owning Application has technical_risk HIGH/CRITICAL, business rules identified). A lifted ResultFocus navigation state (frontend lib/resultNav.ts) gives all 5 result views (Dashboard Geral, Executive, Technical, Functional, Architecture) cross-view drill-down — business-rule/finding lists in Architecture and the source-object link in Functional became clickable, Technical View gained a 'Proposta de Remediação' panel sourced from the owning Application's existing Clean Core recommendation (no new AI field). Assessment/Client breadcrumb and the permanent Copilot panel/context label verified preserved across every navigation (ADR-009/010/015). CAP-006 narrowed: cross-application coupling/dependency-graph deferred as BL-022 (SAPObjectDependency.target_name is never resolved to a target object id, same root gap as BL-016); BL-021 recorded (Baseline's distinct 'customisation identification' AI step has no dedicated capability yet). 215/215 backend pytest (2 new), frontend typecheck/build clean, live Playwright validation against a live-Bedrock-reprocessed Acme Industries assessment confirmed the full drill-down chain end to end (found and fixed one live pluralization bug). See docs/delivery/results/SPRINT-15-RESULT.md."
  - "SPRINT-16 completed (2026-09-26). Final scope: 8 capabilities (CAP-001..CAP-008). The permanent right-side Copilot (previously a disabled placeholder) is now a real chat: new `copilot` AI capability (ai/copilot/schema.py+context.py+__init__.py, registered copilot/v1 in ai.registry) assembles a bounded, citable context package per question — a structured summary (pipeline/dashboard_summary.py, extracted from api/routes/dashboard.py so both share one definition), the current UI selection's own already-persisted evidence-bound detail (ObjectUnderstanding/BusinessRule/CleanCoreAssessment, reusing their existing evidence_refs), semantic_search hits for the question text, and already-retrieved SapKnowledgeReference rows (read-only reuse, chat never triggers a new MCP query per ADR-007) — covering all five Baseline core rule 17 routing channels. POST /assessments/{id}/copilot/ask (api/routes/copilot.py) validates evidence-refs/navigation domain rules before returning (ADR-012); a provider/validation failure returns status=FAILED gracefully, never a 500. Frontend: a plain in-view selection (reusing ResultFocus) lifted to App.tsx alongside cross-view drill-down focus; CopilotPanel.tsx rewritten as a real chat whose message state survives every view switch because the panel is never unmounted (ADR-010) — no conversation persistence to the database. No schema change (alembic head unchanged at 0016_embeddings). 224/224 backend pytest (215 pre-existing + 9 new), frontend typecheck/build clean, alembic check shows only the pre-existing BL-013 drift, a real live Bedrock + Playwright run confirmed grounded Q&A with citations, navigation follow-through and conversation continuity across a view switch (one live bug found and fixed: the model was citing the prompt's bracket annotation instead of the real ref_id). BL-023 recorded (Copilot reference chips for TECHNICAL_FINDING/SUPPLEMENTAL_EVIDENCE/SAP_KNOWLEDGE citations are not click-through — ResultFocus only supports sap_object/business_rule/application as navigable kinds today). See docs/delivery/results/SPRINT-16-RESULT.md."
  - "SPRINT-17 completed (2026-09-26). Final scope: 6 capabilities (CAP-001..CAP-006), demo-hardening polish — no new domain capability, no schema change. Three-panel shell (Sidebar/Workspace/Copilot) is now drag-resizable with localStorage-persisted widths (lib/useResizableWidth.ts, no new dependency). Technical View gained a real Monaco source-code viewer (new bounded GET /assessments/{id}/objects/{object_id}/source endpoint, 512KB cap, monaco-editor's built-in abap Monarch language, local bundle — no CDN, ADR-002) and a React Flow dependency graph (@xyflow/react) replacing the flat object-dependency list — target nodes stay plain labels since SAPObjectDependency.target_name remains unresolved (BL-022/BL-016, untouched). New shared ErrorState.tsx wired into 8 primary list/summary views that previously only branched on isLoading, silently rendering a misleading empty state on a real fetch error. Extracted atc.persistence.persist_atc_import out of api/routes/atc.py (now shared by the route and a new demo-seed step); seed/registry.py v6→v8 adds a compact 4-finding ATC run + a compact HANA Sizing evidence dataset for the persistent Acme demo assessment, imported through the real adapter/durable-pipeline paths. Live Playwright pass over the full demo path (assessment selection → source/supplemental evidence → dashboards → code evidence → Copilot) found and fixed a real blocking defect (React Flow's worker blocked by index.html's CSP, missing worker-src) and a MEDIUM path-traversal gap in the new source endpoint (flagged by an automated security review; fixed with realpath+commonpath containment + absolute-path rejection, 2 new contract tests). 229/229 backend pytest (224 pre-existing + 5 new), frontend typecheck/build clean, alembic check shows only the pre-existing BL-013 drift. BL-024 recorded (Monaco's own editor worker cannot be wired up under electron-vite's Rollup build — cosmetic, not blocking); BL-025 recorded (same unguarded path-join pattern pre-exists at lower severity elsewhere). BL-008 reproduced again pre-finish (an unrelated stray PipelineRun collided with a test's own orphan-recovery assertion) — resolved via the app's own recover_orphans crash-recovery action, no code change. See docs/delivery/results/SPRINT-17-RESULT.md."
