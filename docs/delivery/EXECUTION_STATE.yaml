  - "2026-09-25 architecture update accepted ADR-017 and inserted SPRINT-08 (Supplemental Evidence Foundation) before AI Object Understanding. Completed Sprints 00-07 keep their numbers; former future Sprints 08-16 shift to 09-17."
  - "SPRINT-07 completed: orphan \"Pipeline de Processamento\" nav item removed; durable pipeline (scan/parse/detect_dependencies) is now the real \"3 - Processamento por IA\" step, auto-detecting the current ingestion; scan stage reuses Step 1's completed SourceScan instead of re-walking disk; /objects scoped to the current scan so a new ingestion invalidates stale results until Step 3 reprocesses; manual parse route and ObjectBrowser's Parse button removed. ATC import untouched (ADR-016/BL-002)."
