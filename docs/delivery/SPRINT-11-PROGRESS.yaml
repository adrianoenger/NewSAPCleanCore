capabilities:
  - id: CAP-001
    description: >-
      Deterministic clustering engine (backend/src/ai/application_discovery/clustering.py):
      resolves SAPObjectDependency.target_name/target_type against SAPObject.canonical_key
      within the same assessment (no schema change needed — canonical_key already encodes
      identity), builds a graph from resolved dependency edges plus optional shared-signal
      edges (package_name_raw from correlated ATCFinding, package_name from correlated
      EvidenceRecord, shared ObjectUnderstanding concept tags, reliable process/usage
      evidence correlations when available), and computes candidate clusters (connected
      components) with a provenance/signal-weight record per cluster. Pure/deterministic,
      no AI call.
    status: done
    validation: >-
      backend/src/ai/application_discovery/clustering.py implemented; 11 unit tests in
      test_application_discovery_clustering.py (dependency edge resolved via canonical_key,
      no-signal singleton clusters, shared_package via correlated ATCFinding, shared_concept
      at/below the 50% genericity threshold vs. an ignored 100%-shared concept) pass against
      real Postgres fixtures.
  - id: CAP-002
    description: >-
      Application persistence model (id, assessment_id, name, description, domain,
      confidence, rationale, status CANDIDATE|AI_NAMED|USER_RENAMED|MERGED,
      consolidated_into_id, clustering_signals JSONB provenance, provider/model/prompt
      provenance) + nullable SAPObject.application_id FK (membership). Alembic migration
      0013 (down_revision 0012_business_rule_discovery).
    status: done
    validation: >-
      Application/ApplicationStatus added to persistence/models.py; SAPObject.application_id
      nullable FK added. Migration 0013_application_discovery applied cleanly against the
      running dev Postgres (docker exec sap-clean-core-backend-1 alembic upgrade head); `alembic
      check` shows only the pre-existing BL-013 drift, nothing from this migration.
