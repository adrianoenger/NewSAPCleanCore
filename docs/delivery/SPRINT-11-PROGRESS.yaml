      configured AIProvider via CAP-003 to name/describe/assign domain+confidence+
      rationale, validates before persistence (never a false COMPLETED per ADR-012).
    status: done
    validation: >-
      pipeline/stages.py: application_discovery stage registered in SOURCE_PROCESSING_STAGES
      (depends_on business_rule_discovery). prepare resets non-preserved membership, runs
      clustering, reuses a non-preserved existing Application by majority-overlap or creates a
