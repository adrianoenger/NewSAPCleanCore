notes:
  - >-
    Capability plan derived from docs/delivery/sprints/SPRINT-11-application-discovery.md,
    ADR-008, ADR-012, ADR-005, and the SPRINT-09/SPRINT-10 object_understanding/
    business_rule_discovery stage pattern (backend/src/pipeline/stages.py,
    backend/src/ai/object_understanding/, backend/src/ai/business_rule_discovery/).
  - >-
    Design decision: SAPObjectDependency has no FK to the target SAPObject (only
    target_name/target_type text) — resolution happens at clustering time via
    canonical_key match within the assessment, no schema change required for CAP-001.
  - >-
    Design decision: "related business rules/evidence" are derived via member
    SAPObjects (SAPObject.application_id) rather than duplicated into a new join
    table — business rules/evidence are already evidence-bound at the object level
    (ADR-008); grouping by application is a query-time join, avoiding redundant
    persistence.
  - >-
    Package/transaction/process-usage clustering signals depend on ATC/supplemental
    evidence correlation being present for the assessment; the demo dataset
    (demo-source/ABAP) may exercise mostly the dependency-graph signal — consistent
    with the baseline's "packages/transactions/semantic signals plus reliable
    process/usage correlations when available" wording.
  - "Next Alembic revision is 0013 (down_revision 0012_business_rule_discovery)."
