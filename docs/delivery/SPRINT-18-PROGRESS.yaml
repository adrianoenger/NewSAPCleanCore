notes:
  - "Scope and decisions approved by the user on 2026-09-29 (7-category taxonomy per application, remove perspective views from sidebar, executive summary as pipeline stage + regenerate, formal sprint). ADR-018 and ADR-019 record the decisions."
  - "Defects found during CAP-007 on 1074 and fixed (they would corrupt reprocessed results): (1) reclustering left AI applications with 0 members holding stale v1 English Clean Core rows, inflating 'customizações' and leaving objects unclassified — application_discovery prepare now deletes empty CANDIDATE/AI_NAMED applications (+ their embeddings; Clean Core by cascade), never USER_RENAMED/MERGED (test added); (2) one misplaced ref (DEP-* in business_importance) made the whole Clean Core analysis FAILED — clean_core_analysis.schema.sanitize_result drops out-of-pool refs per dimension and nulls only the dimension left without evidence before validate_result (3 tests added); (3) when a prior cluster split on reclustering, the later fragment re-reused the same application (overwriting its signals and re-absorbing members) — an application is now claimed by at most one cluster per run (test added); (4) INSUFFICIENT_CONTEXT naming left a previously AI_NAMED app as AI_NAMED with an empty name — now demoted to CANDIDATE."
  - "test_embeddings_incrementality_skips_unchanged_content was order-dependent (dict built from an unordered SELECT with BL-020 orphan rows present); fixed with ORDER BY id."
  - "Rodobens 1075 (422 objects) ai_reprocessing run 4381 exposed a real collapse the 1074 demo (5 objects) never could: application_discovery's shared_concept signal (pt-BR AI concepts like 'RFC'/'BAdI'/'integração' below the 50% genericity threshold) chained 421 of 422 objects into one application via the union-find's transitivity, and clean_core_analysis on that application FAILED with Bedrock's 'Input is too long for requested model' — so the technical/business rationales stayed empty. Fixed: (1) removed shared_concept from clustering.py entirely (concepts are free-text AI interpretation, not evidence for a transitive grouping signal — dependency/shared_package only now; test replaced with one asserting concepts never group); simulated on Rodobens data before the fix, dependency+shared_package alone gives 105 clusters, largest 81 members. (2) Both evidence packages (application_discovery, clean_core_analysis) are now bounded per pool (ATC/DEP/TF/EVD caps, most-severe-first, rules-per-member cap, purpose truncation) with an `omitted` count and ATC priority totals rendered as non-citable context, so no single application can overflow the model input again regardless of clustering (test added: 150 ATC findings capped to 80, all 50 P1 kept, totals correct). (3) Added a from-applications AI reprocessing option (`PipelineRunKind.AI_REPROCESSING_APPLICATIONS`, `POST .../reprocess-ai?from_stage=application_discovery`, 'Só aplicações → Clean Core → resumo' button) that reuses the already-correct pt-BR object_understanding/business_rule_discovery instead of redoing all 422 objects — used to re-validate Rodobens without a multi-hour rerun (test added: asserts the provider is never called for the reused schemas)."
  - "Run 4505 applied the above to Rodobens 1075: 105 applications, no orphans, but 32/105 (30%) Clean Core rows came back FAILED with 'technical_risk_rationale/... must be empty when technical_risk is null' — a second, distinct real defect only visible at this scale: the model routinely writes a short explanation for *why* technical_risk/business_importance is null even though the v2 prompt says to leave the rationale empty in that case (e.g. 'não há evidência suficiente de processo/negócio para este módulo'), which the strict domain validator correctly rejected as an assertion-without-evidence violation. Fixed in clean_core_analysis.schema.sanitize_result: a leftover rationale/refs on a dimension the model itself already left null is now dropped (never asserted) instead of failing the whole analysis; recommendation's rationale is still allowed to stay per its own already-documented exception (test added). Re-run (4518) on 1075: 105 applications, clean_core_assessment 105/105 rows, 0 FAILED (49 COMPLETED / 56 INSUFFICIENT_CONTEXT), pt-BR rationales, recommendation distribution MODERNIZAR 38 / REMEDIAR 11 / Não classificado 56 — see the CAP-007 validation note for the full outcome plus Playwright evidence."
  - "Cosmetic pt-BR/branding polish requested after CAP-007's live validation: the permanent right-side chat panel's header/aria-labels ('Copilot de IA' -> 'AIDA', CopilotPanel.tsx) and its empty-state welcome copy were reworded. Text-only, no behavior/schema change; no test asserts the old strings. Verified with frontend typecheck/build (both clean)."
