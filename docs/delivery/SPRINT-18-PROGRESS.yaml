  - id: CAP-007
    description: Reprocess assessments to regenerate texts in pt-BR
    status: completed
    validation: "Demo 1074: ai_reprocessing run 4380 completed (all 6 AI stages, 0 failed items) — understanding, business rules, application rationale, Clean Core rationale and executive summary all pt-BR; 2 applications (5-object cluster REMEDIAR/HIGH; singleton DDIC domain INSUFFICIENT_CONTEXT -> 'Não classificado'), no orphan apps; dashboard-overview consistent (REMEDIAR 5 objects, Não classificado 1). Playwright: dashboard panels (test-results/s18-cap007-dashboard-1074.png); Copilot 'Quais objetos o clean core categorizou como Remediar, me explique o porque' -> ANSWERED pt-BR listing the 5 objects with rationale, refs CATALOG-OBJECTS/CATALOG-CC-1647 + 'Ver aplicação' (test-results/s18-cap007-copilot-remediar-1074.png).

      Rodobens 1075 (422 objects) initially collapsed: ai_reprocessing run 4381 grouped 421 of 422 objects into one application via the shared_concept clustering signal, and its clean_core_analysis FAILED with Bedrock's 'Input is too long for requested model'. Root-caused and fixed (see the note below) with the user's approval, then re-validated end to end from application_discovery onward (new ai_reprocessing_applications kind, reusing the already-correct pt-BR object_understanding/business_rule_discovery) via run 4505 (105 applications, top size 81, no orphans, 0 failed items) then, after a second real defect surfaced (32/105 Clean Core rows FAILED on a model-attached rationale for a dimension it left null) and was fixed, run 4518: 105 applications (unchanged), clean_core_assessment 105/105 rows all prompt_version v2, 0 FAILED (49 COMPLETED, 56 INSUFFICIENT_CONTEXT — legitimate, most small clusters genuinely lack enough evidence), recommendation distribution {MODERNIZAR: 38, REMEDIAR: 11, Não classificado: 56}, executive_summary and embeddings (989 rows) regenerated with 0 failed items. Playwright on 1075: dashboard donut/KPIs/panels pt-BR (test-results/s18-cap007-dashboard-rodobens-fixed.png); application detail 'Integração SAP-RCFROTA' (11 members) shows Risco Técnico/Importância de Negócio fully pt-BR, evidence-cited, coherent (test-results/s18-cap007-application-detail-rodobens-fixed.png); Resumo Executivo regenerated and reflects the new 105-application state (test-results/s18-cap007-executive-summary-rodobens-fixed.png). Demo 1074 re-verified from applications onward too (run 4519): 3 applications instead of 2 — the AI itself now declines to name the former 5-object/ZPACKAGE cluster (INSUFFICIENT_CONTEXT, confidence 0.25: 'agrupamento por pacote técnico não é suficiente... sem conceitos de negócio compartilhados') while Clean Core still runs on it (REMEDIAR/HIGH via its ATC findings) — a more honest, non-fabricated naming outcome, not a regression. Final checks: targeted pytest 60+50+23 passed across the affected files, full suite pytest re-run with no live run active (BL-008-safe) — 262 passed in 16:55; npm typecheck/build clean; alembic upgrade head ok, alembic check shows only the pre-existing BL-013 drift (unchanged signature: sap_object canonical_key unique-constraint/index shape + technical_finding.atc_finding_id index).

      User follow-up: 'Distribuição Clean Core Classification' on 1075 looked too shallow (only MODERNIZAR/REMEDIAR/Não classificado; never MANTER_AS_IS/DESCONTINUAR/REIMPLEMENTAR_EXTENSAO/SUBSTITUIR_STANDARD/ATUALIZAR_OSS) and asked whether mcp-sap-docs/mcp-abap (ADR-007) were actually being consumed. Investigated read-only first: `SapKnowledgeReference` had 0 rows in the whole database (no endpoint configured) and every non-technical supplemental-evidence capability for 1075 (Panaya SAP Notes, Signavio process KPIs, Readiness Check simplification/custom-code items) was 100% uncorrelated to any SAPObject — verified against the real adapters/payloads, not a decoding bug (BL-026). Cross-tabulating technical_risk×recommendation also showed every determined risk level mapping only to MODERNIZAR/REMEDIAR, never MANTER_AS_IS even for the app with LOW risk — a real prompt gap, not a data gap. Fixed with the user's approval: (1) wired the real, public, no-auth `mcp-sap-docs`/`mcp-abap` hosted instances (`marianfoo/mcp-sap-docs`) via `.env`/`.env.example` (BL-018 resolved) — found and fixed a real bug in the process (`mcp_client.py`'s 'first line = title' heuristic mangled the server's actual JSON `{"results": [...]}` response shape; `_parse_search_results_json` now decodes it, 2 new tests); bulk-fetched guidance for all 105 Rodobens applications via the existing manual-trigger `fetch_guidance` service (105/105 ok, 630 SapKnowledgeReference rows, no code/architecture change — the pipeline still never auto-triggers MCP per ADR-007, this was a one-time operational backfill mirroring clicking 'Consultar SAP Docs' per application); (2) added decision heuristics to the clean_core_analysis v2 prompt tying already-determined technical_risk/business_importance to specific categories (LOW risk -> consider MANTER_AS_IS; BAdI/user-exit/implicit-enhancement pattern -> REIMPLEMENTAR_EXTENSAO vs a broader legacy-technique pattern -> MODERNIZAR; SAP_KNOWLEDGE citation required for SUBSTITUIR_STANDARD/ATUALIZAR_OSS; usage-absence required for DESCONTINUAR, never inferred from a signal that was never collected). Investigated (per the user's approved option) whether Panaya's raw export has a note-to-object or usage-absence link elsewhere: found no verifiable section — the original export file is no longer present in this environment to check unmapped candidates like SCI_HANA_ISSUES(_DETAILS) without guessing (BL-026, ADR-017). Re-validated end to end on 1075 (run 4600, from application_discovery, reusing understanding/rules): 105 applications (unchanged sizes), clean_core_assessment 105/105, 0 FAILED, 54 COMPLETED/51 INSUFFICIENT_CONTEXT, recommendation distribution now {MODERNIZAR: 20, MANTER_AS_IS: 16, REIMPLEMENTAR_EXTENSAO: 11, REMEDIAR: 7, Não classificado: 51} — 4 categories instead of 2, and technical_risk=LOW (17 apps) now correctly maps to MANTER_AS_IS (16) instead of never. SAP guidance is now real and rendered (Playwright: 'Orientação SAP' panel on an application detail shows live help.sap.com links, test-results/s18-cap007-dashboard-rodobens-mcp-final.png for the updated 5-category donut) but was never actually cited as recommendation evidence (0/105) — the generic `search` tool's broad hits were not specific enough; BL-027 records the natural next step (`sap_get_object_details`'s real Clean Core A/B/C/D verdicts) as future work, not attempted this sprint. Targeted pytest (sap_knowledge/clean_core_analysis/pipeline/reprocess_ai/application_discovery) 60/60 passed after every change; full suite re-run once more at the end with no live run active (BL-008-safe) — 264 passed in 17:10 (2 more than the earlier 262, from the 2 new mcp_client JSON-parsing tests); frontend typecheck/build clean; alembic upgrade head a no-op (already current)."
